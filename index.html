<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Finance Tracker · build 73</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<meta name="theme-color" content="#0b1120" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Finance" />
<link rel="apple-touch-icon" href="favicon.svg" />
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root {
    --bg: #101417; --bg2: #141a1e; --panel: #1b2328; --panel2: #263137;
    --border: #344047; --text: #e8edef; --muted: #a0afb6;
    --accent: #2dd4bf; --accent2: #38bdf8;
    --green: #34d399; --red: #f87171; --yellow: #fbbf24; --purple: #a78bfa;
  }
  body.light {
    --bg: #f1f5f9; --bg2: #ffffff; --panel: #ffffff; --panel2: #e2e8f0;
    --border: #cbd5e1; --text: #0f172a; --muted: #64748b;
    --accent: #0d9488; --accent2: #0284c7;
    --green: #16a34a; --red: #dc2626; --yellow: #d97706; --purple: #7c3aed;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }

  .app { display: flex; min-height: 100vh; }
  .sidebar { width: 240px; background: var(--bg2); border-right: 1px solid var(--border); padding: 24px 16px; position: sticky; top: 0; height: 100vh; flex-shrink: 0; overflow-y: auto; }
  .navhead { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); opacity: .7; margin: 16px 14px 6px; }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700; margin-bottom: 28px; padding: 0 8px; }
  .brand-logo { width: 30px; height: 30px; border-radius: 8px; display: block; box-shadow: 0 4px 14px rgba(20,184,166,.22); }
  .nav button { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: transparent; border: none; color: var(--muted); padding: 10px 14px; border-radius: 10px; font-size: 15px; cursor: pointer; margin-bottom: 2px; transition: all .15s; }
  .nav button:hover { background: var(--panel); color: var(--text); }
  .nav button.active { background: linear-gradient(90deg, rgba(45,212,191,.20), rgba(56,189,248,.05)); color: var(--accent); font-weight: 600; box-shadow: inset 3px 0 0 var(--accent); }
  .nav button .ico { font-size: 18px; width: 22px; text-align: center; }
  .ic { width: 1.2em; height: 1.2em; display: inline-block; vertical-align: -0.2em; flex-shrink: 0; }
  .nav button .ico .ic { width: 20px; height: 20px; vertical-align: middle; }

  .main { flex: 1; min-width: 0; padding: 32px 40px; max-width: 1200px; }
  /* Mobile bottom tab bar + slide-up sheet (hidden on desktop) */
  .botnav { display: none; }
  .sheet { display: none; }
  @media (max-width: 760px) {
    .app { flex-direction: column; }
    .sidebar { width: 100%; height: auto; position: sticky; top: 0; z-index: 40; display: flex; align-items: center; justify-content: space-between; padding: 12px 18px; padding-top: calc(12px + env(safe-area-inset-top)); border-right: none; border-bottom: 1px solid var(--border); background: var(--bg2); background: color-mix(in srgb, var(--bg2) 88%, transparent); backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px); }
    .brand { margin: 0; font-size: 18px; }
    .nav, .navhead, .sidebar > button.btn, .sidebar > .mini { display: none; }
    .main { padding: 18px 15px; padding-bottom: calc(90px + env(safe-area-inset-bottom)); }

    .botnav { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; justify-content: space-around; gap: 2px; padding: 7px 6px; padding-bottom: calc(7px + env(safe-area-inset-bottom)); background: var(--bg2); background: color-mix(in srgb, var(--bg2) 92%, transparent); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); border-top: 1px solid var(--border); box-shadow: 0 -6px 24px rgba(0,0,0,.28); }
    .botnav button { flex: 1; background: transparent; border: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 5px 2px; font-family: inherit; cursor: pointer; border-radius: 12px; transition: color .15s, transform .1s; }
    .botnav button:active { transform: scale(.9); }
    .botnav button .ico { font-size: 21px; line-height: 1; }
    .botnav button .label { font-size: 10px; font-weight: 600; letter-spacing: .1px; }
    .botnav button.active { color: var(--accent); }

    .sheet { display: block; position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.5); opacity: 0; pointer-events: none; transition: opacity .22s ease; }
    .sheet.open { opacity: 1; pointer-events: auto; }
    .sheet-card { position: absolute; left: 0; right: 0; bottom: 0; background: var(--bg2); border-radius: 22px 22px 0 0; border-top: 1px solid var(--border); padding: 8px 16px; padding-bottom: calc(22px + env(safe-area-inset-bottom)); transform: translateY(101%); transition: transform .28s cubic-bezier(.32,.72,0,1); max-height: 84vh; overflow-y: auto; }
    .sheet.open .sheet-card { transform: translateY(0); }
    .sheet-grip { width: 42px; height: 4px; border-radius: 3px; background: var(--border); margin: 8px auto 16px; }
    .sheet-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .sheet-grid button { background: var(--panel); border: 1px solid var(--border); color: var(--text); border-radius: 16px; padding: 15px 6px; display: flex; flex-direction: column; align-items: center; gap: 7px; font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer; transition: transform .1s; }
    .sheet-grid button:active { transform: scale(.94); }
    .sheet-grid button.active { border-color: var(--accent); color: var(--accent); background: linear-gradient(160deg, rgba(45,212,191,.14), transparent); }
    .sheet-grid button .ico { font-size: 23px; }
  }
  .main { animation: ftpage .24s ease; }
  @keyframes ftpage { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
  .page-title { font-size: 29px; font-weight: 700; margin: 0 0 4px; letter-spacing: -0.6px; }
  .page-sub { color: var(--muted); margin: 0 0 28px; font-size: 14px; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 18px; margin-bottom: 28px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 18px; padding: 22px; box-shadow: 0 2px 8px rgba(0,0,0,.15); transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease; }
  .card:hover { transform: translateY(-3px); box-shadow: 0 14px 30px rgba(0,0,0,.28); border-color: var(--border); }
  .card .label { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .cicon { width: 38px; height: 38px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-size: 19px; flex-shrink: 0; margin: -6px 0; }
  .card .value { font-size: 27px; font-weight: 700; word-break: break-word; letter-spacing: -0.5px; }
  .card .sub { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .pos { color: var(--green); } .neg { color: var(--red); }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 18px; padding: 24px; margin-bottom: 22px; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  .panel h3 { margin: 0 0 18px; font-size: 17px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap: wrap; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
  @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }

  input, select { background: var(--bg2); border: 1px solid var(--border); color: var(--text); padding: 11px 13px; border-radius: 10px; font-size: 14px; width: 100%; outline: none; font-family: inherit; transition: border-color .12s ease, box-shadow .12s ease; }
  input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(45,212,191,.16); }
  label.field { display: block; }
  label.field span { display:block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .form-row { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); align-items: end; }

  button.btn { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #04231f; border: none; padding: 11px 18px; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 14px; white-space: nowrap; font-family: inherit; box-shadow: 0 3px 10px rgba(45,212,191,.28); transition: transform .12s ease, box-shadow .12s ease, filter .12s ease; }
  button.btn:hover { filter: brightness(1.06); box-shadow: 0 5px 16px rgba(45,212,191,.34); }
  button.btn:active { transform: translateY(1px); box-shadow: 0 1px 5px rgba(45,212,191,.3); }
  button.btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--border); box-shadow: none; }
  button.btn.ghost:hover { background: var(--panel2); }
  button.btn.sm { padding: 7px 12px; font-size: 13px; }
  button.icon-btn { background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 16px; padding: 4px 8px; border-radius: 8px; }
  button.icon-btn:hover { color: var(--red); background: rgba(248,113,113,.1); }

  table { width: 100%; border-collapse: separate; border-spacing: 0 8px; font-size: 14px; }
  th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .4px; padding: 2px 14px; }
  td { padding: 13px 14px; background: var(--bg); transition: background .12s ease; }
  tbody tr td:first-child { border-radius: 12px 0 0 12px; }
  tbody tr td:last-child { border-radius: 0 12px 12px 0; }
  tbody tr:hover td { background: var(--panel2); }
  .tag { padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .tag.income { background: rgba(52,211,153,.15); color: var(--green); }
  .tag.expense { background: rgba(248,113,113,.15); color: var(--red); }

  .progress { height: 10px; background: var(--bg2); border-radius: 999px; overflow: hidden; }
  .progress > div { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .4s; }

  .goal { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 18px; }
  .empty { color: var(--muted); text-align: center; padding: 30px; font-size: 14px; }
  .row-between { display:flex; align-items:center; justify-content: space-between; gap: 12px; }
  .mini { font-size: 12px; color: var(--muted); }
  .toolbar { display:flex; gap: 10px; flex-wrap: wrap; align-items:center; }
  .hint { background: rgba(56,189,248,.08); border: 1px solid rgba(56,189,248,.25); color: #bae6fd; padding: 12px 16px; border-radius: 12px; font-size: 13px; margin-bottom: 22px; }
  .legend { list-style: none; padding: 0; margin: 12px 0 0; }
  .legend li { display: flex; align-items: center; gap: 10px; font-size: 13px; padding: 5px 0; }
  .legend .sw { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
  .legend .amt { margin-left: auto; color: var(--muted); }
  .chart-wrap { width: 100%; }
  @keyframes ftfall { to { transform: translateY(110vh) rotate(340deg); } }

  /* Launch splash */
  .splash { position: fixed; inset: 0; z-index: 100000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: radial-gradient(120% 120% at 50% 0%, #0f766e 0%, #0b1120 55%); transition: opacity .45s ease, visibility .45s; }
  .splash.hide { opacity: 0; visibility: hidden; }
  .splash .logo { width: 84px; height: 84px; border-radius: 22px; display: block; box-shadow: 0 12px 40px rgba(20,184,166,.35); animation: splashPop .6s cubic-bezier(.2,.9,.25,1.3); }
  .splash .stitle { font-size: 22px; font-weight: 800; letter-spacing: -.4px; color: #f8fafc; }
  .splash .sspin { width: 26px; height: 26px; border-radius: 50%; border: 3px solid rgba(255,255,255,.18); border-top-color: #2dd4bf; animation: splashSpin .8s linear infinite; }
  @keyframes splashPop { 0% { transform: scale(.4); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes splashSpin { to { transform: rotate(360deg); } }

  /* Toasts */
  #ftToasts { position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); z-index: 90000; display: flex; flex-direction: column; align-items: center; gap: 8px; padding-bottom: calc(22px + env(safe-area-inset-bottom)); pointer-events: none; }
  @media (max-width: 760px) { #ftToasts { padding-bottom: calc(98px + env(safe-area-inset-bottom)); } }
  .ftToast { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 999px; padding: 11px 16px 11px 20px; font-size: 14px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,.35); display: flex; align-items: center; gap: 9px; animation: toastIn .3s cubic-bezier(.2,.9,.25,1.2); max-width: 90vw; pointer-events: auto; }
  .ftToast .undo-btn { border: 0; border-left: 1px solid var(--border); background: transparent; color: var(--accent); font: inherit; padding: 2px 4px 2px 12px; margin-left: 4px; cursor: pointer; }
  .ftToast.out { animation: toastOut .3s ease forwards; }
  .ftToast .tdot { color: var(--accent); font-size: 16px; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(20px) scale(.9); } to { opacity: 1; transform: none; } }
  @keyframes toastOut { to { opacity: 0; transform: translateY(20px) scale(.9); } }

  /* Centered modal (debt payoff prompt) */
  .modal-ov { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; padding: 22px; animation: toastIn .2s ease; }
  .modal-card { background: var(--panel); border: 1px solid var(--border); border-radius: 22px; padding: 26px 24px; max-width: 380px; width: 100%; box-shadow: 0 24px 70px rgba(0,0,0,.5); animation: splashPop .35s cubic-bezier(.2,.9,.25,1.2); }

  /* Transactions: quick add + day-grouped list */
  .qa-type { display: inline-flex; background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 3px; gap: 3px; }
  .qa-type button { border: none; background: transparent; color: var(--muted); font: inherit; font-weight: 700; font-size: 14px; padding: 8px 16px; border-radius: 9px; cursor: pointer; }
  .qa-type button.on[data-qtype="expense"] { background: rgba(248,113,113,.18); color: var(--red); }
  .qa-type button.on[data-qtype="income"] { background: rgba(52,211,153,.18); color: var(--green); }
  .seg button.on { background: rgba(45,212,191,.18); color: var(--accent); }
  .qa-amt { display: flex; align-items: center; gap: 8px; background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 6px 14px; margin: 14px 0 12px; }
  .qa-amt span { font-size: 22px; font-weight: 700; color: var(--muted); }
  .qa-amt input { border: none; background: transparent; box-shadow: none !important; font-size: 30px; font-weight: 800; padding: 6px 0; letter-spacing: -.5px; }
  .qa-chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 12px; }
  .qa-chip { border: 1px solid var(--border); background: var(--bg2); color: var(--text); font: inherit; font-size: 13px; font-weight: 600; padding: 7px 11px; border-radius: 999px; cursor: pointer; }
  .qa-chip.on { border-color: var(--accent); background: rgba(45,212,191,.16); color: var(--accent); }
  .tx-day { margin-top: 16px; }
  .tx-dayhead { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; padding: 0 4px 6px; border-bottom: 1px solid var(--border); }
  .tx-row { display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-bottom: 1px solid var(--border); }
  .tx-ico { width: 38px; height: 38px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
  .tx-main { flex: 1; min-width: 0; }
  .tx-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tx-amt { font-weight: 700; white-space: nowrap; }
  .tx-acts { display: flex; flex-shrink: 0; }
  .tx-acts .icon-btn { padding: 4px 6px; }
  .app-tools { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 18px; margin-bottom: 22px; border-bottom: 1px solid var(--border); }
  .app-tools .toolbar { gap: 6px; flex-wrap: nowrap; }
  button.tool-btn { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; padding: 0; border: 1px solid var(--border); border-radius: 8px; background: transparent; color: var(--text); cursor: pointer; font: inherit; }
  button.tool-btn:hover { background: var(--panel2); }
  button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .sync-badge { display: inline-flex; align-items: center; gap: 7px; max-width: 100%; padding: 6px 0; background: none; border: 0; color: var(--muted); font: inherit; font-size: 12px; text-align: left; cursor: pointer; }
  .sync-dot { width: 7px; height: 7px; flex-shrink: 0; border-radius: 50%; background: var(--muted); }
  .sync-badge[data-tone="ok"] .sync-dot { background: var(--green); }
  .sync-badge[data-tone="busy"] .sync-dot { background: var(--accent2); }
  .sync-badge[data-tone="warn"] .sync-dot { background: var(--yellow); }
  .sync-badge[data-tone="error"] .sync-dot { background: var(--red); }
  .month-summary { margin: 0 0 26px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 16px 0; }
  .month-summary-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .month-summary h2 { font-size: 16px; margin: 0; }
  .month-picker { display: flex; align-items: center; gap: 6px; }
  .month-picker input { width: 156px; min-width: 0; padding: 9px; }
  .month-stats { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 14px; }
  .month-stats > div { min-width: 0; }
  .month-stats .value { font-size: 23px; font-weight: 700; margin: 5px 0; overflow-wrap: anywhere; }
  .account-breakdown { display: grid; gap: 16px; }
  .dashboard-cards .card { border-radius: 8px; padding: 18px; min-width: 0; }
  .dashboard-cards .card .value { letter-spacing: 0; }
  .dashboard-cards .card:hover { transform: none; }
  .spend-amount { font-size: 32px; font-weight: 800; line-height: 1.2; overflow-wrap: anywhere; }
  .spend-columns { display: grid; grid-template-columns: minmax(0,1.4fr) minmax(0,1fr); gap: 16px; text-align: center; }
  .spend-columns > div + div { border-left: 1px solid var(--border); padding-left: 16px; }
  .main .page-title, .splash .stitle, .qa-amt input { letter-spacing: 0; }
  body.light .hint { color: var(--text); }
  body.light .backup-nudge { color: #85530b !important; }
  .card { border-radius: 8px; box-shadow: none; }
  .card:hover { transform: none; box-shadow: none; }
  .card .value, .card .label, .navhead, .botnav button .label { letter-spacing: 0; }
  .panel { background: transparent; border: 0; border-bottom: 1px solid var(--border); border-radius: 0; padding: 20px 0; box-shadow: none; }
  .dashboard-cards { grid-template-columns: repeat(4,minmax(0,1fr)); gap: 14px; margin-bottom: 24px; }
  .holdings { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 20px; padding: 0 0 22px; margin-bottom: 8px; border-bottom: 1px solid var(--border); }
  .holdings > div { min-width: 0; }
  .holdings .value { font-size: 23px; font-weight: 700; margin: 6px 0; overflow-wrap: anywhere; }
  .dashboard-detail { border-top: 1px solid var(--border); margin: 18px 0; padding-top: 16px; }
  .dashboard-detail > summary { cursor: pointer; font-size: 15px; font-weight: 600; padding: 4px 0 16px; }
  .dashboard-detail > .grid2 { margin-top: 8px; }
  .sidebar { display: flex; flex-direction: column; }
  .app-content { display: flex; width: 100%; min-width: 0; }
  .sidebar .nav { flex: 1; }
  .sidebar .nav button { border-radius: 6px; padding: 12px; }
  .sidebar-footer { border-top: 1px solid var(--border); margin-top: 20px; padding-top: 12px; }
  .sidebar-footer .nav { margin-bottom: 12px; }
  .sheet { display: block; position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.65); visibility: hidden; opacity: 0; pointer-events: none; transition: opacity .15s; }
  .sheet.open { visibility: visible; opacity: 1; pointer-events: auto; }
  .sheet-card { position: absolute; left: 50%; top: 10%; bottom: auto; width: min(640px,calc(100% - 32px)); max-height: 80vh; overflow-y: auto; transform: translateX(-50%); background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 22px; }
  .sheet.open .sheet-card { transform: translateX(-50%); }
  .sheet-heading { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .sheet-heading h2 { font-size: 20px; margin: 0; }
  .sheet-group h3 { font-size: 12px; color: var(--muted); font-weight: 600; margin: 22px 0 8px; }
  .sheet-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 4px 14px; }
  .sheet-grid button { display: flex; align-items: center; gap: 12px; background: none; border: 0; border-radius: 6px; color: var(--text); text-align: left; font: inherit; font-size: 14px; padding: 12px 8px; cursor: pointer; min-height: 44px; }

  function fmt(n) { if (privacy) return (state.currency || "$") + "•••"; return (state.currency || "$") + num(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function today() { return ymdLocal(new Date()); }

  }
  function recordNetWorth() {
    if (!state.nwHistory) state.nwHistory = [];
    var ym = ymOfDate(new Date(today() + "T00:00:00")), nv = totals().netWorth, ex = null;
    for (var i = 0; i < state.nwHistory.length; i++) if (state.nwHistory[i].ym === ym) ex = state.nwHistory[i];

  function el(id) { return document.getElementById(id); }
  function val(id) { var e = el(id); return e ? e.value : ""; }

  function calendarEvents(ym) {

    var t = arr[i]; arr[i] = arr[j]; arr[j] = t; return true;
  }
  function payoffMonths(remaining, annualRate, payment) {
    remaining = num(remaining); payment = num(payment);
    var r = num(annualRate) / 100 / 12;
    if (remaining <= 0) return 0;
    if (payment <= 0) return Infinity;
    if (r === 0) return Math.ceil(remaining / payment);
    if (payment <= remaining * r) return Infinity;
    return Math.ceil(-Math.log(1 - (r * remaining) / payment) / Math.log(1 + r));
  }

  function simulateDebts(strategy, extra) {
    var list = state.debts.map(function (d) {
      return { remaining: num(d.remaining), rate: num(d.rate) / 100 / 12, min: num(d.payment), creditor: d.creditor };
    }).filter(function (d) { return d.remaining > 0; });
    if (!list.length) return { months: 0, interest: 0, order: [] };
    var months = 0, interest = 0, order = [], guard = 0;
    while (list.some(function (d) { return d.remaining > 0.005; }) && guard < 1200) {
      guard++; months++;
      list.forEach(function (d) { if (d.remaining > 0) { var i = d.remaining * d.rate; d.remaining += i; interest += i; } });
      var pool = num(extra);
      list.forEach(function (d) { if (d.remaining > 0) { var m = Math.min(d.min, d.remaining); d.remaining -= m; if (d.min > m) pool += (d.min - m); } });
      var active = list.filter(function (d) { return d.remaining > 0.005; });
      active.sort(function (a, b) { return strategy === "avalanche" ? b.rate - a.rate : a.remaining - b.remaining; });
      for (var k = 0; k < active.length && pool > 0.005; k++) {
        var pay = Math.min(pool, active[k].remaining);
        active[k].remaining -= pay; pool -= pay;
      }
      list.forEach(function (d) { if (d.remaining <= 0.005 && order.indexOf(d.creditor) < 0) order.push(d.creditor); });
    }
    return { months: guard >= 1200 ? Infinity : months, interest: interest, order: order };
  }

  function debtCalcResults() {
    if (!state.debts.length) return '<div class="empty">Add debts above to use the calculator.</div>';
    var extra = num(pageDebt.extra);
    var sn = simulateDebts("snowball", extra), av = simulateDebts("avalanche", extra);
    function box(name, r, sub) {
      var m = r.months === Infinity ? "Never" : r.months + " mo";
      var detail = r.months === Infinity ? "payments too low to clear" : "≈ " + (r.months / 12).toFixed(1) + " yrs · interest " + fmt(r.interest);
      var ord = r.order.length ? '<div class="mini" style="margin-top:8px">Order: ' + r.order.map(esc).join(" → ") + '</div>' : "";
      return '<div class="card"><div class="label">' + name + '</div><div class="value" style="font-size:22px">' + m + '</div><div class="sub">' + detail + '</div>' + ord + '<div class="mini" style="margin-top:6px">' + sub + '</div></div>';
    }
    var verdict = (av.interest < sn.interest - 0.5) ? "⛰ Avalanche saves the most interest." : (sn.interest < av.interest - 0.5 ? "❄ Snowball costs slightly less here." : "Both strategies are about the same.");
    return '<div class="cards" style="margin-top:16px">' +
      box("❄ Snowball", sn, "Smallest balance first — fast wins") +
      box("⛰ Avalanche", av, "Highest rate first — least interest") +
      '</div><div class="mini" style="margin-top:6px">' + verdict + ' (estimate)</div>';
  }

  /* ---------- SVG charts (no dependencies) ---------- */
  function areaChart(series) {
    if (!series.length) return '<div class="empty">Add transactions to see your balance trend.</div>';
    var w = 600, h = 240, p = 34;
    var vals = series.map(function (s) { return s.balance; });
    var min = Math.min.apply(null, vals.concat([0])), max = Math.max.apply(null, vals.concat([0]));
    if (min === max) { max += 1; min -= 1; }
    var n = series.length;
    function X(i) { return p + (n === 1 ? (w - 2 * p) / 2 : (i / (n - 1)) * (w - 2 * p)); }
    function Y(v) { return h - p - ((v - min) / (max - min)) * (h - 2 * p); }
    var pts = series.map(function (s, i) { return X(i) + "," + Y(s.balance); });
    var area = "M" + X(0) + "," + (h - p) + " L" + pts.join(" L") + " L" + X(n - 1) + "," + (h - p) + " Z";
    var zeroY = Y(0);
    var dots = series.map(function (s, i) { return '<circle cx="' + X(i) + '" cy="' + Y(s.balance) + '" r="3" fill="#2dd4bf" />'; }).join("");
    return '<div class="chart-wrap"><svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" preserveAspectRatio="xMidYMid meet">' +
      '<defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.45"/><stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/></linearGradient></defs>' +
      '<line x1="' + p + '" y1="' + zeroY + '" x2="' + (w - p) + '" y2="' + zeroY + '" stroke="var(--border)" stroke-dasharray="3 3"/>' +
      '<path d="' + area + '" fill="url(#ga)"/>' +
      '<polyline points="' + pts.join(" ") + '" fill="none" stroke="#2dd4bf" stroke-width="2.5"/>' + dots +
      '<text x="' + p + '" y="16" fill="var(--muted)" font-size="11">' + fmt(max) + '</text>' +
      '<text x="' + p + '" y="' + (h - 10) + '" fill="var(--muted)" font-size="11">' + fmt(min) + '</text>' +
      '</svg></div>';
  }

  function donut(items, centerLabel, centerSub) {
    var total = items.reduce(function (s, i) { return s + i.value; }, 0);
    if (total <= 0) return '<div class="empty">No data yet.</div>';
    var R = 60, W = 22, C = 2 * Math.PI * R, off = 0;
    var segs = items.map(function (it, idx) {
      var frac = it.value / total, len = frac * C;
      var s = '<circle cx="80" cy="80" r="' + R + '" fill="none" stroke="' + it.color + '" stroke-width="' + W + '" stroke-dasharray="' + len + ' ' + (C - len) + '" stroke-dashoffset="' + (-off) + '"/>';
      off += len; return s;
    }).join("");
    var center = centerLabel ? '<text x="80" y="78" text-anchor="middle" fill="' + (centerSub === "accent" ? "#2dd4bf" : "var(--text)") + '" font-size="26" font-weight="700">' + centerLabel + '</text>' +
      '<text x="80" y="98" text-anchor="middle" fill="var(--muted)" font-size="11">' + (centerSub === "accent" ? "funded" : "") + '</text>' : "";
    return '<svg viewBox="0 0 160 160" width="170" height="170" style="display:block;margin:0 auto"><g transform="rotate(-90 80 80)">' +
      '<circle cx="80" cy="80" r="' + R + '" fill="none" stroke="var(--bg2)" stroke-width="' + W + '"/>' + segs + '</g>' + center + '</svg>';
  }

  function legend(items) {
    return '<ul class="legend">' + items.map(function (i) {
      return '<li><span class="sw" style="background:' + i.color + '"></span>' + esc(i.name) + '<span class="amt">' + fmt(i.value) + '</span></li>';
    }).join("") + '</ul>';
  }

  function monthShort(ym) { var p = ym.split("-"); return new Date(p[0], (+p[1]) - 1, 1).toLocaleDateString(undefined, { month: "short" }); }
  function monthlyChart() {
    var m = {};
    state.transactions.forEach(function (t) { var k = (t.date || "").slice(0, 7); if (!k) return; if (!m[k]) m[k] = { inc: 0, exp: 0 }; if (t.type === "income") m[k].inc += num(t.amount); else m[k].exp += num(t.amount); });
    var keys = Object.keys(m).sort();
    if (!keys.length) return '<div class="empty">Add transactions to see monthly trends.</div>';
    keys = keys.slice(-6);
    var data = keys.map(function (k) { return { ym: k, inc: m[k].inc, exp: m[k].exp }; });
    var w = 600, h = 240, p = 34, n = data.length;
    var max = Math.max.apply(null, data.map(function (d) { return Math.max(d.inc, d.exp); }).concat([1]));
    var slot = (w - 2 * p) / n, bw = Math.min(26, slot / 3.2);
    function Y(v) { return h - p - (v / max) * (h - 2 * p); }
    var bars = "";
    data.forEach(function (d, i) {
      var cx = p + slot * i + slot / 2;
      bars += '<rect x="' + (cx - bw - 2) + '" y="' + Y(d.inc) + '" width="' + bw + '" height="' + (h - p - Y(d.inc)) + '" rx="3" fill="#34d399"/>';
      bars += '<rect x="' + (cx + 2) + '" y="' + Y(d.exp) + '" width="' + bw + '" height="' + (h - p - Y(d.exp)) + '" rx="3" fill="#f87171"/>';
      bars += '<text x="' + cx + '" y="' + (h - 12) + '" text-anchor="middle" fill="var(--muted)" font-size="11">' + monthShort(d.ym) + '</text>';
    });
    return '<div class="chart-wrap"><svg viewBox="0 0 ' + w + ' ' + h + '" width="100%">' +
      '<line x1="' + p + '" y1="' + (h - p) + '" x2="' + (w - p) + '" y2="' + (h - p) + '" stroke="var(--border)"/>' + bars + '</svg></div>' +
      '<div class="toolbar" style="margin-top:6px;font-size:12px"><span style="color:#34d399">■ Income</span><span style="color:#f87171">■ Expense</span></div>';
  }

  function ring(pct, color, size) {
    size = size || 90;
    pct = Math.max(0, pct);
    var r = (size / 2) - 8, c = 2 * Math.PI * r, len = Math.min(100, pct) / 100 * c;
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '" style="flex-shrink:0">' +
      '<g transform="rotate(-90 ' + (size / 2) + ' ' + (size / 2) + ')">' +
      '<circle cx="' + (size / 2) + '" cy="' + (size / 2) + '" r="' + r + '" fill="none" stroke="var(--border)" stroke-width="8"/>' +
      '<circle cx="' + (size / 2) + '" cy="' + (size / 2) + '" r="' + r + '" fill="none" stroke="' + (color || "#2dd4bf") + '" stroke-width="8" stroke-linecap="round" stroke-dasharray="' + len + ' ' + (c - len) + '"/>' +
      '</g>' +
      '<text x="' + (size / 2) + '" y="' + (size / 2 + size * 0.08) + '" text-anchor="middle" fill="var(--text)" font-size="' + (size * 0.22) + '" font-weight="700">' + pct.toFixed(0) + '%</text>' +
      '</svg>';
  }

  /* ---------- pages ---------- */
  function dashboardMonthSummary(ym) {

    state.transactions.forEach(function (tx) {

    });

    return '<section class="month-summary" aria-label="Monthly summary"><div class="month-summary-head"><h2>Monthly summary</h2>' +
      '<div class="month-picker"><button class="tool-btn" data-act="dashboardMonthPrev" title="Previous month" aria-label="Previous month">&#8249;</button>' +

      '<div><div class="mini">Expenses</div><div class="value neg">' + fmt(expense) + '</div></div>' +

      '<div class="row-between mini" style="margin-top:10px"><span>' + count + ' transaction' + (count === 1 ? '' : 's') + '</span>' +
      '<button class="btn ghost sm" data-act="dashboardMonthTransactions">View transactions</button></div></section>';
  }
  function dashboardAccountBreakdown() {
    var accs = state.accounts || [], max = accs.reduce(function (s, a) { return Math.max(s, Math.abs(num(a.balance))); }, 1);
    return '<div class="account-breakdown">' + accs.map(function (a) {
      return '<div><div class="row-between" style="margin-bottom:7px"><span>' + esc(a.name) + '</span><strong class="' + (num(a.balance) < 0 ? "neg" : "") + '">' + fmt(a.balance) + '</strong></div>' +
        '<div class="progress" style="height:7px"><div style="width:' + (Math.abs(num(a.balance)) / max * 100) + '%;' + (num(a.balance) < 0 ? 'background:var(--red)' : '') + '"></div></div></div>';
    }).join("") + '</div>';
  }
  function pageDashboard() {
    var t = totals();
    var ym = pageDashboard.ym || ymOfDate(new Date());
    var sorted = state.transactions.slice().sort(function (a, b) { return (a.date || "").localeCompare(b.date || ""); });
    var running = num(state.openingBalance), map = {};
    sorted.forEach(function (tx) { running += tx.type === "income" ? num(tx.amount) : -num(tx.amount); map[tx.date] = running; });
    var series = Object.keys(map).sort().map(function (d) { return { date: d, balance: map[d] }; });

    var catMap = {};
    state.transactions.forEach(function (tx) { if (tx.type === "expense" && (tx.date || "").slice(0, 7) === ym) { var c = tx.category || "Other"; catMap[c] = (catMap[c] || 0) + num(tx.amount); } });
    var cats = Object.keys(catMap).map(function (k, i) { return { name: k, value: catMap[k], color: COLORS[i % COLORS.length] }; });

    var comp = [
      { name: "Cash Balance", value: Math.max(0, t.balance), color: COLORS[0] },
      { name: "Goal Savings (cash)", value: t.goalCash, color: COLORS[1] },
      { name: "Emergency Fund", value: t.emFund, color: COLORS[2] },
      { name: "Trading", value: Math.max(0, t.tradingBalance), color: COLORS[3] }
    ].filter(function (x) { return x.value > 0; });
    var compMax = comp.reduce(function (m, x) { return Math.max(m, x.value); }, 1);
    var compHtml = comp.length ? comp.map(function (x) {
      return '<div style="margin-bottom:14px"><div class="row-between" style="margin-bottom:6px"><span>' + x.name + '</span><strong>' + fmt(x.value) + '</strong></div>' +
        '<div class="progress"><div style="width:' + (x.value / compMax * 100) + '%;background:' + x.color + '"></div></div></div>';
    }).join("") : '<div class="empty">Add data to see your net worth breakdown.</div>';

    var emTarget = num(state.emergency.monthlyExpenses) * num(state.emergency.months);
    var emPct = emTarget > 0 ? Math.min(100, t.emFund / emTarget * 100) : 0;
    var goalTargetTotal = state.goals.reduce(function (s, g) { return s + num(g.target); }, 0);
    var goalCurTotal = state.goals.reduce(function (s, g) { return s + num(g.current); }, 0);
    var goalPct = goalTargetTotal > 0 ? Math.min(100, goalCurTotal / goalTargetTotal * 100) : 0;
    var debtOrig = state.debts.reduce(function (s, d) { return s + num(d.total); }, 0);
    var debtRem = state.debts.reduce(function (s, d) { return s + num(d.remaining); }, 0);
    var debtPct = debtOrig > 0 ? Math.min(100, (debtOrig - debtRem) / debtOrig * 100) : 0;
    function ptile(pct, color, label) { return '<div>' + ring(pct, color, 110) + '<div class="mini" style="margin-top:8px">' + label + '</div></div>'; }
    var ptiles = [];
    if (emTarget > 0) ptiles.push(ptile(emPct, "#2dd4bf", "Emergency Fund"));
    if (goalTargetTotal > 0) ptiles.push(ptile(goalPct, "#38bdf8", "Goals Saved"));
    if (debtOrig > 0) ptiles.push(ptile(debtPct, "#34d399", "Debt Paid Off"));
    var progressPanel = ptiles.length ? '<div class="panel"><h3>Progress at a Glance</h3><div style="display:flex;gap:30px;flex-wrap:wrap;justify-content:space-around;text-align:center">' + ptiles.join("") + '</div></div>' : "";

    var safeInfo = safeToSpendInfo(t.balance), safe = safeInfo.value;
    var nwSeries = (state.nwHistory || []).slice().sort(function (a, b) { return a.ym.localeCompare(b.ym); }).map(function (h) { return { date: monthShort(h.ym), balance: h.value }; });
    var nwHist = (state.nwHistory || []).slice().sort(function (a, b) { return a.ym.localeCompare(b.ym); });
    var nwRows = nwHist.slice(-12).map(function (h, i, arr) {
      var prev = i > 0 ? arr[i - 1].value : null;
      var chg = prev == null ? null : h.value - prev;
      var pctChg = (prev && prev !== 0) ? (chg / Math.abs(prev) * 100) : null;
      return { ym: h.ym, value: h.value, chg: chg, pctChg: pctChg };
    }).reverse().map(function (r) {
      return '<tr><td><strong>' + monthShort(r.ym) + " " + r.ym.slice(0, 4) + '</strong></td>' +
        '<td style="text-align:right" class="' + (r.value >= 0 ? "pos" : "neg") + '">' + fmt(r.value) + '</td>' +
        '<td style="text-align:right" class="' + (r.chg == null ? "" : (r.chg >= 0 ? "pos" : "neg")) + '">' + (r.chg == null ? '<span class="mini">—</span>' : (r.chg >= 0 ? "+" : "−") + fmt(Math.abs(r.chg))) + '</td>' +
        '<td style="text-align:right" class="mini">' + (r.pctChg == null ? "—" : (r.pctChg >= 0 ? "+" : "") + r.pctChg.toFixed(1) + "%") + '</td></tr>';
    }).join("");
    var nwTable = nwHist.length ? '<div style="overflow-x:auto;margin-top:18px"><table><thead><tr><th>Month</th><th style="text-align:right">Net worth</th><th style="text-align:right">Change</th><th style="text-align:right">%</th></tr></thead><tbody>' + nwRows + '</tbody></table></div>' : "";
    var nwPanel = nwHist.length ? '<div class="panel"><h3>📈 Net Worth Over Time</h3>' +
      (nwSeries.length >= 2 ? areaChart(nwSeries) : '<p class="mini" style="margin:-4px 0 0">One month recorded so far — the trend line appears once you have two.</p>') +
      nwTable + '</div>' : "";

    var tgt = state.targets || {};
    var balBar = num(tgt.balance) > 0 ? t.balance / num(tgt.balance) * 100 : null;
    var trdBar = num(tgt.trading) > 0 ? t.tradingBalance / num(tgt.trading) * 100 : null;

    var balanceSetup = state.accountMode && state.accounts.length
      ? '<p class="mini" style="margin:0 0 14px">Dashboard balance comes from your Accounts total. Update individual balances in <button class="linkbtn" data-tab="accounts">Accounts</button>.</p>'
      : '<p class="mini" style="margin:0 0 14px">Dashboard balance is your starting balance plus income minus expenses.</p><div class="form-row" style="max-width:420px"><label class="field"><span>Current cash on hand (' + (state.currency || "$") + ')</span><input id="ob_input" type="number" value="' + num(state.openingBalance) + '"/></label><button class="btn" data-act="setOB">Save</button></div>';
    var dashboardSetup = privacy ? '<details class="panel"><summary><strong>Dashboard settings</strong></summary><div style="margin-top:18px"><button class="btn ghost sm" data-act="privacy">Show amounts</button></div></details>' : '<details class="panel"><summary><strong>Dashboard settings</strong></summary><div style="margin-top:18px">' + balanceSetup +
      '<h3 style="margin-top:22px">Targets</h3><p class="mini" style="margin:-8px 0 14px">Set targets to show progress on the balance and trading cards.</p>' +
      '<div class="form-row" style="max-width:560px"><label class="field"><span>Balance target (' + (state.currency || "$") + ')</span><input id="tg_balance" type="number" value="' + num(tgt.balance) + '"/></label>' +
      '<label class="field"><span>Trading target (' + (state.currency || "$") + ')</span><input id="tg_trading" type="number" value="' + num(tgt.trading) + '"/></label><button class="btn" data-act="setTargets">Save</button></div></div></details>';

    return '<h1 class="page-title">Dashboard</h1><p class="page-sub">' + esc(ymLabel(ymOfDate(new Date()), true)) + '</p>' +
      overBudgetAlert() + backupNudge() +
      '<div class="cards dashboard-cards">' +
        card("Current Balance", fmt(t.balance), (t.usingAccounts ? "Total across " + state.accounts.length + " accounts" : "Income " + fmt(t.income) + " · Expenses " + fmt(t.expense)), t.balance >= 0 ? "pos" : "neg", "💰", "rgba(52,211,153,.16)", balBar) +
        card("Safe to Spend", fmt(safe), "After " + fmt(safeInfo.commitments) + " due through " + safeInfo.until + (safeInfo.usesPayday ? " (payday)" : " (30 days)"), safe >= 0 ? "pos" : "neg", "💸", "rgba(251,191,36,.16)") +
        card("Total Debt", fmt(t.totalDebt), state.debts.length + " debt" + (state.debts.length !== 1 ? "s" : "") + " tracked", "neg", "💳", "rgba(248,113,113,.16)") +
        card("Net Worth", fmt(t.netWorth), "Gifts excluded", t.netWorth >= 0 ? "pos" : "neg", "📈", "rgba(56,189,248,.16)") +
      '</div>' + dashboardMonthSummary(ym) +
      '<section class="holdings" aria-label="Savings and trading"><div><div class="mini">Emergency fund</div><div class="value">' + fmt(t.emFund) + '</div><div class="mini">Target ' + fmt(emTarget) + '</div></div>' +
      '<div><div class="mini">Trading balance</div><div class="value ' + (t.tradingBalance >= 0 ? 'pos' : 'neg') + '">' + fmt(t.tradingBalance) + '</div><div class="mini">' + state.trading.trades.length + ' trades</div></div>' +
      '<div><div class="mini">Gift saved</div><div class="value">' + fmt(t.goalGift) + '</div><div class="mini">Excluded from net worth</div></div></section>' +
      dueSoonPanel() + progressPanel +
      '<details class="dashboard-detail"><summary>Trends and breakdowns</summary><div class="grid2">' +
        '<div class="panel"><h3>' + (t.usingAccounts ? 'Account balances' : 'Balance Over Time') + '</h3>' + (t.usingAccounts ? dashboardAccountBreakdown() : areaChart(series)) + '</div>' +
        '<div class="panel"><h3>Spending by Category <span class="mini">' + esc(ymLabel(ym, true)) + '</span></h3>' + (cats.length ? donut(cats) + legend(cats) : '<div class="empty">No expenses this month.</div>') + '</div>' +
      '</div>' +
      '<div class="panel"><h3>Monthly Income vs Expense</h3>' + monthlyChart() + '</div>' + nwPanel +
      '<div class="panel"><h3>Net Worth Composition</h3>' + compHtml + '</div></details>' +
      (num(state.spendLimit) > 0 || Object.keys(state.budgets || {}).length ? spendHero() : '<details class="dashboard-detail"><summary>Monthly spending limit</summary>' + spendHero() + '</details>') + dashboardSetup;
  }

  function card(label, value, sub, cls, icon, iconBg, barPct) {
    var ic = icon ? '<span class="cicon" style="background:' + (iconBg || "rgba(45,212,191,.16)") + '">' + icon + '</span>' : '';

    return '<div class="card"><div class="label"><span>' + label + '</span>' + ic + '</div><div class="value ' + (cls || "") + '">' + value + '</div>' + (sub ? '<div class="sub">' + sub + '</div>' : '') + bar + '</div>';
  }

  function ensureGoalBuckets(g) {
    if (g.cashSaved == null && g.giftSaved == null) { g.cashSaved = num(g.current); g.giftSaved = 0; }
    g.cashSaved = num(g.cashSaved); g.giftSaved = num(g.giftSaved);

  function commitGoalPlan() {

    var months = Object.keys(g.plans).filter(function (m) { return m >= cur && num(g.plans[m].amount) > 0; }).sort();
    var left = num(a);
    for (var i = 0; i < months.length && left > 0; i++) {
      var m = months[i], amt = num(g.plans[m].amount);

  function savingsStrategyPanel() {
    var goals = (state.goals || []).filter(function (g) { return !goalDone(g); });
    if (!goals.length) return "";
    var monthly = num(pageGoals.strategyAmt);
    if (!monthly) return '<div class="panel"><h3>🧮 Savings Strategy</h3>' +
      '<p class="mini" style="margin:-8px 0 12px">Enter what you can save each month and compare two ways to split it.</p>' +
      '<div class="form-row" style="max-width:420px"><label class="field"><span>Monthly savings (' + (state.currency || "$") + ')</span><input id="gs_amt" type="number" placeholder="200"/></label>' +
      '<button class="btn" data-act="calcStrategy">Compare</button></div></div>';
    function simulate(mode) {
      var list = goals.map(function (g) { return { name: g.name, need: Math.max(0, num(g.target) - num(g.current)) }; }).filter(function (g) { return g.need > 0; });
      if (!list.length) return { months: 0, order: [] };
      var months = 0, order = [], guard = 0;
      while (list.some(function (g) { return g.need > 0.005; }) && guard < 1200) {
        guard++; months++;
        var pool = monthly;
        if (mode === "focus") {
          for (var i = 0; i < list.length && pool > 0.005; i++) { var take = Math.min(pool, list[i].need); list[i].need -= take; pool -= take; }
        } else {
          var act = list.filter(function (g) { return g.need > 0.005; });
          var share = pool / act.length;
          act.forEach(function (g) { var take = Math.min(share, g.need); g.need -= take; });
        }
        list.forEach(function (g) { if (g.need <= 0.005 && order.indexOf(g.name) < 0) order.push(g.name); });

  // A month plan "has an amount" when one was explicitly set — including 0 ("nothing due this month").
  function planHasAmt(pl) { return !!pl && pl.amount != null && pl.amount !== ""; }
  function planHas(d, ym) { return planHasAmt(d.monthlyPlans && d.monthlyPlans[ym]) || planHasAmt(d.plans && d.plans[ym]); }
  function planShown(pl) { return planHasAmt(pl) ? String(num(pl.amount)) : ""; }
  function validDebtMonth(ym) { return /^\d{4}-(0[1-9]|1[0-2])$/.test(ym || ""); }
  function selectedDebtMonth() { return validDebtMonth(pageDebt.month) ? pageDebt.month : ymOfDate(new Date()); }
  function debtPaymentMonth(p) { return validDebtMonth(p.month) ? p.month : (p.date || "").slice(0, 7); }
  function debtMonthInfo(d, ym) {
    var records = (Array.isArray(d.payments) ? d.payments : []).filter(function (p) { return debtPaymentMonth(p) === ym && (!p.kind || p.kind === "payment" || p.kind === "reversal"); });
    var paid = money(Math.max(0, records.reduce(function (s, p) { return s + (p.kind === "reversal" ? -1 : 1) * num(p.amount); }, 0)));
    var stored = d.monthlyPlans && d.monthlyPlans[ym], legacy = d.plans && d.plans[ym], planned, note = (stored && stored.note) || (legacy && legacy.note) || "";
    if (planHasAmt(stored)) { planned = num(stored.amount); note = stored.note || ""; }

    } else planned = d.startYm && ym < d.startYm ? 0 : Math.min(Math.max(0, num(d.payment)), Math.max(0, num(d.remaining)) + paid);

  }

  function pad2(n) { return n < 10 ? "0" + n : "" + n; }
  function paceDefaultTarget() {

  function monthPaceCard() {

    var target = state.paceTarget || paceDefaultTarget();
    var targetDate = new Date(target + "T00:00:00");
    if (isNaN(targetDate.getTime())) { target = paceDefaultTarget(); targetDate = new Date(target + "T00:00:00"); }
    var daysLeft = Math.max(0, Math.round((targetDate.getTime() - now.getTime()) / 86400000));
    var isDefault = target === paceDefaultTarget();
    var curYm = ymOfDate(now);

    state.transactions.forEach(function (t) { if ((t.date || "").slice(0, 7) === curYm && t.type === "expense") { spent += num(t.amount); txCount++; } });

    return '<div class="cards">' + spentCard + projCard + '</div>' + setter;

  // The big "how much can I still spend, and for how many days" panel.
  function spendStatus() {
    var td = today(), now = new Date(td + "T00:00:00"), curYm = ymOfDate(now);
    var target = state.paceTarget || paceDefaultTarget(), targetDate = new Date(target + "T00:00:00");
    if (isNaN(targetDate.getTime())) { target = paceDefaultTarget(); targetDate = new Date(target + "T00:00:00"); }
    var days = Math.max(1, Math.round((targetDate.getTime() - now.getTime()) / 86400000) + 1); // includes today
    var spent = 0, spentToday = 0;
    state.transactions.forEach(function (t) {
      if (t.type !== "expense" || (t.date || "").slice(0, 7) !== curYm) return;
      spent += num(t.amount); if (t.date === td) spentToday += num(t.amount);
    });
    var budgets = state.budgets || {};
    var catTotal = Object.keys(budgets).reduce(function (s, k) { return s + num(budgets[k]); }, 0);
    var limit = num(state.spendLimit) > 0 ? num(state.spendLimit) : catTotal;
    var left = limit - spent;
    var daily = Math.max(0, (limit - (spent - spentToday)) / days); // what each remaining day (incl. today) gets
    return { limit: limit, fromCats: !(num(state.spendLimit) > 0) && catTotal > 0, spent: spent, spentToday: spentToday, left: left,
      days: days, perDay: left > 0 ? left / days : 0, todayLeft: daily - spentToday, endLabel: targetDate.toLocaleDateString(undefined, { day: "numeric", month: "short" }),
      isDefault: target === paceDefaultTarget(), monthName: now.toLocaleDateString(undefined, { month: "long" }) };
  }

      '<div class="row-between mini" style="margin-top:7px"><span>Spent ' + fmt(s.spent) + ' of ' + fmt(s.limit) + (s.fromCats ? ' (your category budgets)' : '') + '</span>' +
        '<span>' + (s.isDefault ? s.days + (s.days === 1 ? " day" : " days") + " incl. today" : "counting to " + s.endLabel) + '</span></div>' +
      '<details style="margin-top:8px"><summary class="mini" style="cursor:pointer">✎ Change monthly limit</summary>' + limitForm +
        '<p class="mini" style="text-align:center;margin:6px 0 0">Leave empty to use the total of your category budgets. Change the countdown date in Month overview below.</p></details>' +
      '</div>';
  }

  var INCOME_CATS = ["Salary", "Freelance", "Gift", "Savings", "Other"];
  var EXPENSE_CATS = CATEGORIES.filter(function (c) { return ["Salary", "Freelance", "Gift"].indexOf(c) < 0; });
  function txDayLabel(ds) {
    var td = today(), y = ymdLocal(new Date(new Date(td + "T00:00:00").getTime() - 86400000));
    if (ds === td) return "Today";
    if (ds === y) return "Yesterday";
    var d = new Date(ds + "T00:00:00");
    return isNaN(d.getTime()) ? ds : d.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
  }
  function txEditForm(t, hasAcc, hasBud) {
    return '<div style="padding:12px;margin:6px 0;border:1px solid var(--accent);border-radius:12px;background:var(--bg2)">' +
      '<div class="form-row">' +
        '<label class="field"><span>Amount</span><input id="et_amount" type="number" step="0.01" value="' + num(t.amount) + '"/></label>' +
        '<label class="field"><span>Type</span><select id="et_type"><option value="expense"' + (t.type === "expense" ? " selected" : "") + '>Expense</option><option value="income"' + (t.type === "income" ? " selected" : "") + '>Income</option></select></label>' +
        '<label class="field"><span>Category</span><select id="et_cat">' + CATEGORIES.map(function (c) { return '<option value="' + c + '"' + (t.category === c ? " selected" : "") + '>' + catMeta(c).e + " " + c + '</option>'; }).join("") + '</select></label>' +
        '<label class="field"><span>Date</span><input id="et_date" type="date" value="' + esc(t.date) + '"/></label>' +
        '<label class="field"><span>Note</span><input id="et_note" value="' + esc(t.note || "") + '"/></label>' +
        (hasAcc ? '<label class="field"><span>Account</span><select id="et_account">' + accountOptions(t.account, state.accountMode) + '</select></label>' : '') +
        (hasBud ? '<label class="field"><span>Budget</span><select id="et_budget">' + budgetOptions(t.budget) + '</select></label>' : '') +
      '</div><div class="toolbar" style="margin-top:10px"><button class="btn sm" data-act="editTxSave" data-id="' + t.id + '">Save</button><button class="btn ghost sm" data-act="editTxCancel">Cancel</button></div></div>';
  }
  function pageTransactions() {
    var cur = state.currency || "$", realYm = ymOfDate(new Date(today() + "T00:00:00"));
    var ym = pageTransactions.ym || realYm;
    var f = pageTransactions.filter || "all";
    var q = (pageTransactions.q || "").toLowerCase(), fromD = pageTransactions.from || "", toD = pageTransactions.to || "";
    var filtering = !!(q || fromD || toD || f !== "all");
    var rows = state.transactions.slice();
    if (filtering) {
      if (f !== "all") rows = rows.filter(function (t) { return t.type === f; });
      if (q) rows = rows.filter(function (t) { return ((t.note || "") + " " + (t.category || "")).toLowerCase().indexOf(q) >= 0; });
      if (fromD) rows = rows.filter(function (t) { return (t.date || "") >= fromD; });
      if (toD) rows = rows.filter(function (t) { return (t.date || "") <= toD; });
    } else rows = rows.filter(function (t) { return (t.date || "").slice(0, 7) === ym; });
    var order = {}; state.transactions.forEach(function (t, i) { order[t.id] = i; });
    rows.sort(function (a, b) { return (b.date || "").localeCompare(a.date || "") || (order[b.id] - order[a.id]); }); // newest day first; newest entry first within a day
    var hasAcc = (state.accounts || []).length, hasBud = (state.budgetGroups || []).length;

    // ---- quick add ----
    var qType = pageTransactions.qType || "expense";
    var lastExp = pageTransactions.lastExpCat, lastInc = pageTransactions.lastIncCat;
    if (!lastExp) { for (var i = state.transactions.length - 1; i >= 0; i--) if (state.transactions[i].type === "expense") { lastExp = state.transactions[i].category; break; } }
    if (!lastExp || EXPENSE_CATS.indexOf(lastExp) < 0) lastExp = "Food";
    if (!lastInc || INCOME_CATS.indexOf(lastInc) < 0) lastInc = "Salary";
    var selCat = qType === "income" ? lastInc : lastExp;
    function chips(list, kind) {
      return '<div class="qa-chips" data-qset="' + kind + '"' + (qType === kind ? '' : ' hidden') + '>' + list.map(function (c) {
        return '<button type="button" class="qa-chip' + (c === selCat && qType === kind ? ' on' : '') + '" data-qcat="' + c + '">' + catMeta(c).e + ' ' + c + '</button>';
      }).join("") + '</div>';
    }
    var more = (hasAcc ? '<label class="field"><span>Account' + (state.accountMode ? " (required)" : "") + '</span><select id="t_account">' + accountOptions("", state.accountMode) + '</select></label>' : '') +
      (hasBud ? '<label class="field"><span>Budget</span><select id="t_budget">' + budgetOptions("") + '</select></label>' : '');
    var quick = '<div class="panel">' +
      '<div class="row-between"><div class="qa-type"><button type="button" data-qtype="expense"' + (qType === "expense" ? ' class="on"' : '') + '>− Expense</button><button type="button" data-qtype="income"' + (qType === "income" ? ' class="on"' : '') + '>+ Income</button></div>' +
        '<input id="t_date" type="date" value="' + today() + '" style="width:auto"/></div>' +
      '<input type="hidden" id="t_type" value="' + qType + '"/><input type="hidden" id="t_cat" value="' + selCat + '"/>' +
      '<div class="qa-amt"><span>' + esc(cur) + '</span><input id="t_amount" type="number" inputmode="decimal" step="0.01" placeholder="0.00" autocomplete="off"/></div>' +
      chips(EXPENSE_CATS, "expense") + chips(INCOME_CATS, "income") +
      '<div style="display:flex;gap:10px;align-items:center"><input id="t_note" placeholder="What was it? (optional)" style="flex:1"/><button class="btn" data-act="addTx" style="padding:12px 22px">Add</button></div>' +
      (more ? '<details style="margin-top:10px"><summary class="mini" style="cursor:pointer">More options</summary><div class="form-row" style="margin-top:10px">' + more + '</div></details>' : '') +
      '</div>';

    // ---- month strip ----
    var mInc = 0, mExp = 0;
    state.transactions.forEach(function (t) { if ((t.date || "").slice(0, 7) !== ym) return; if (t.type === "income") mInc += num(t.amount); else mExp += num(t.amount); });
    var strip = '<div class="panel" style="padding:16px 18px">' +
      '<div class="row-between" style="margin-bottom:12px"><button class="btn ghost sm" data-act="txPrevM">◀</button>' +
        '<strong style="font-size:17px">' + ymLabel(ym, true) + '</strong>' +
        '<span style="display:flex;gap:6px">' + (ym !== realYm ? '<button class="btn ghost sm" data-act="txNowM">↺</button>' : '') + '<button class="btn ghost sm" data-act="txNextM">▶</button></span></div>' +
      '<div style="display:flex;justify-content:space-around;text-align:center;gap:10px">' +
        '<div><div class="mini">Spent</div><div style="font-size:22px;font-weight:800" class="neg">' + fmt(mExp) + '</div></div>' +
        '<div><div class="mini">Income</div><div style="font-size:22px;font-weight:800" class="pos">' + fmt(mInc) + '</div></div>' +
        '<div><div class="mini">Net</div><div style="font-size:22px;font-weight:800" class="' + (mInc - mExp >= 0 ? "pos" : "neg") + '">' + (mInc - mExp >= 0 ? "+" : "−") + fmt(Math.abs(mInc - mExp)) + '</div></div>' +
      '</div></div>';

    // ---- list grouped by day ----
    var days = [], byDay = {};
    rows.forEach(function (t) { var d = t.date || ""; if (!byDay[d]) { byDay[d] = []; days.push(d); } byDay[d].push(t); });
    var list = days.map(function (d) {
      var out = 0, inn = 0;
      byDay[d].forEach(function (t) { if (t.type === "income") inn += num(t.amount); else out += num(t.amount); });
      var head = '<div class="tx-dayhead"><span>' + txDayLabel(d) + (filtering ? ' · ' + d.slice(0, 4) : '') + '</span><span>' +
        (out ? '<span class="neg">−' + fmt(out) + '</span>' : '') + (inn ? ' <span class="pos">+' + fmt(inn) + '</span>' : '') + '</span></div>';
      return '<div class="tx-day">' + head + byDay[d].map(function (t) {
        if (editTxId === t.id) return txEditForm(t, hasAcc, hasBud);
        var m = catMeta(t.category), inc = t.type === "income";
        var sub = esc(t.category || "Other") + ((t.account && accountName(t.account)) ? ' · ' + esc(accountName(t.account)) : '');
        return '<div class="tx-row"><span class="tx-ico" style="background:' + m.bg + '">' + m.e + '</span>' +
          '<div class="tx-main"><div class="tx-title">' + esc(t.note || t.category || "Transaction") + '</div><div class="mini">' + sub + '</div></div>' +
          '<div class="tx-amt ' + (inc ? "pos" : "neg") + '">' + (inc ? "+" : "−") + fmt(t.amount) + '</div>' +
          '<span class="tx-acts"><button class="icon-btn" data-act="editTx" data-id="' + t.id + '" title="Edit">✎</button><button class="icon-btn" data-act="delTx" data-id="' + t.id + '" title="Delete">✕</button></span></div>';
      }).join("") + '</div>';
    }).join("");
    var empty = filtering ? '<div class="empty">Nothing matches your filter.</div>' : '<div class="empty">Nothing logged in ' + ymLabel(ym, true) + ' yet — add your first one above.</div>';

    // ---- filters (tucked away) ----
    var filterBox = '<details' + (filtering ? ' open' : '') + ' style="margin-bottom:6px"><summary class="mini" style="cursor:pointer">🔎 Search & filter</summary>' +
      '<div class="toolbar" style="margin-top:10px">' +
        '<input id="tx_q" placeholder="Search note or category" style="width:200px" value="' + esc(pageTransactions.q || "") + '"/>' +
        '<select id="t_filter" data-act="filter" style="width:130px"><option value="all">All</option><option value="income">Income</option><option value="expense">Expenses</option></select>' +
        '<input id="tx_from" type="date" style="width:150px" value="' + esc(fromD) + '"/><span class="mini">to</span><input id="tx_to" type="date" style="width:150px" value="' + esc(toD) + '"/>' +
        '<button class="btn sm" data-act="txFilter">Search</button><button class="btn ghost sm" data-act="txClear">Clear</button>' +
      '</div></details>';
    var listPanel = '<div class="panel">' + filterBox +
      (filtering ? '<div class="hint" style="margin:8px 0 0">Showing filtered results from all months · <button class="btn ghost sm" data-act="txClear">Clear filter</button></div>' : '') +
      (list || empty) + '</div>';

    return '<h1 class="page-title">Transactions</h1>' +
      spendHero() + quick + overBudgetAlert() + strip + listPanel +
      '<h3 style="margin:26px 0 12px">Month overview</h3>' + monthPaceCard() + categorySummary();
  }

  function pageTrading() {
    var tr = state.trading;
    var profit = 0, loss = 0, wins = 0, losses = 0;
    tr.trades.forEach(function (t) { if (t.result === "loss") { loss += num(t.amount); losses++; } else { profit += num(t.amount); wins++; } });
    var net = profit - loss;
    var balance = num(tr.startBalance) + net;
    var total = wins + losses;
    var winRate = total > 0 ? wins / total * 100 : 0;

    var sorted = tr.trades.slice().sort(function (a, b) { return (a.date || "").localeCompare(b.date || ""); });
    var running = num(tr.startBalance), map = {};
    sorted.forEach(function (t) { running += t.result === "loss" ? -num(t.amount) : num(t.amount); map[t.date] = running; });
    var series = Object.keys(map).sort().map(function (d) { return { date: d, balance: map[d] }; });

    var rows = tr.trades.slice().sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); }).map(function (t) {
      if (editTradeId === t.id) {
        return '<tr>' +
          '<td><input id="etr_date" type="date" value="' + esc(t.date) + '" style="width:150px"/></td>' +
          '<td><input id="etr_symbol" value="' + esc(t.symbol || "") + '" style="width:90px"/></td>' +
          '<td><select id="etr_result"><option value="profit"' + (t.result !== "loss" ? " selected" : "") + '>Profit</option><option value="loss"' + (t.result === "loss" ? " selected" : "") + '>Loss</option></select></td>' +
          '<td><input id="etr_amount" type="number" value="' + num(t.amount) + '" style="width:100px;text-align:right"/></td>' +
          '<td><input id="etr_note" value="' + esc(t.note || "") + '" style="min-width:110px"/></td>' +
          '<td style="white-space:nowrap"><button class="btn sm" data-act="editTradeSave" data-id="' + t.id + '">Save</button> <button class="icon-btn" data-act="editTradeCancel">✕</button></td></tr>';
      }
      var isLoss = t.result === "loss";
      return '<tr><td>' + esc(t.date) + '</td><td><strong>' + esc(t.symbol || "—") + '</strong></td>' +
        '<td><span class="tag ' + (isLoss ? "expense" : "income") + '">' + t.result + '</span></td>' +
        '<td style="text-align:right" class="' + (isLoss ? "neg" : "pos") + '">' + (isLoss ? "−" : "+") + fmt(t.amount) + '</td>' +
        '<td class="mini">' + esc(t.note) + '</td>' +
        '<td style="white-space:nowrap"><button class="icon-btn" data-act="editTrade" data-id="' + t.id + '">✎</button><button class="icon-btn" data-act="delTrade" data-id="' + t.id + '">✕</button></td></tr>';
    }).join("");

    var winsArr = tr.trades.filter(function (t) { return t.result !== "loss"; }).map(function (t) { return num(t.amount); });
    var lossArr = tr.trades.filter(function (t) { return t.result === "loss"; }).map(function (t) { return num(t.amount); });
    var avgWin = winsArr.length ? profit / winsArr.length : 0;
    var avgLoss = lossArr.length ? loss / lossArr.length : 0;
    var bigWin = winsArr.length ? Math.max.apply(null, winsArr) : 0;
    var bigLoss = lossArr.length ? Math.max.apply(null, lossArr) : 0;
    var profitFactor = loss > 0 ? profit / loss : (profit > 0 ? Infinity : 0);
    var byDate = tr.trades.slice().sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); });
    var streak = 0, streakType = "";
    for (var si = 0; si < byDate.length; si++) {
      var rr = byDate[si].result === "loss" ? "loss" : "win";
      if (si === 0) { streakType = rr; streak = 1; } else if (rr === streakType) { streak++; } else break;
    }
    var streakLabel = streak ? streak + " " + (streakType === "win" ? "win" + (streak !== 1 ? "s" : "") : "loss" + (streak !== 1 ? "es" : "")) : "—";
    var statsPanel = tr.trades.length ? '<div class="panel"><h3>Performance</h3><div class="cards" style="margin:0">' +
      card("Avg Win", fmt(avgWin), "", "pos") +
      card("Avg Loss", fmt(avgLoss), "", "neg") +
      card("Biggest Win", fmt(bigWin), "", "pos") +
      card("Biggest Loss", fmt(bigLoss), "", "neg") +
      card("Profit Factor", profitFactor === Infinity ? "∞" : profitFactor.toFixed(2), "Profit ÷ Loss", profitFactor >= 1 ? "pos" : "neg") +
      card("Current Streak", streakLabel, "", streakType === "win" ? "pos" : (streakType === "loss" ? "neg" : "")) +
      '</div></div>' : "";

    var symMap = {};
    tr.trades.forEach(function (t) { var s = t.symbol || "—"; if (!symMap[s]) symMap[s] = { net: 0, n: 0 }; symMap[s].net += (t.result === "loss" ? -num(t.amount) : num(t.amount)); symMap[s].n++; });
    var symRows = Object.keys(symMap).sort(function (a, b) { return symMap[b].net - symMap[a].net; }).map(function (s) {
      var o = symMap[s];
      return '<tr><td><strong>' + esc(s) + '</strong></td><td>' + o.n + '</td><td style="text-align:right" class="' + (o.net >= 0 ? "pos" : "neg") + '">' + (o.net >= 0 ? "+" : "−") + fmt(Math.abs(o.net)) + '</td></tr>';
    }).join("");
    var symPanel = tr.trades.length ? '<div class="panel"><h3>By Symbol</h3><div style="overflow-x:auto"><table><thead><tr><th>Symbol</th><th>Trades</th><th style="text-align:right">Net P/L</th></tr></thead><tbody>' + symRows + '</tbody></table></div></div>' : "";

    return '<h1 class="page-title">Trading</h1><p class="page-sub">Log your trades and track profit, loss, and balance.</p>' +
      '<div class="panel"><h3>Trading Capital</h3>' +
        '<p class="mini" style="margin:-8px 0 14px">Your starting trading balance. Profits and losses below adjust it.</p>' +
        '<div class="form-row" style="max-width:420px">' +
          '<label class="field"><span>Starting capital (' + (state.currency || "$") + ')</span><input id="tr_start" type="number" value="' + num(tr.startBalance) + '"/></label>' +
          '<button class="btn" data-act="setTradeStart">Save</button>' +
        '</div></div>' +
      '<div class="cards">' +
        card("Trading Balance", fmt(balance), "Capital " + fmt(tr.startBalance) + " + P/L", balance >= num(tr.startBalance) ? "pos" : "neg", null, null, (num((state.targets || {}).trading) > 0 ? balance / num(state.targets.trading) * 100 : null)) +
        card("Net P/L", (net >= 0 ? "+" : "−") + fmt(Math.abs(net)), tr.trades.length + " trade" + (tr.trades.length !== 1 ? "s" : ""), net >= 0 ? "pos" : "neg") +
        card("Total Profit", fmt(profit), wins + " win" + (wins !== 1 ? "s" : ""), "pos") +
        card("Total Loss", fmt(loss), losses + " loss" + (losses !== 1 ? "es" : ""), "neg") +
        card("Win Rate", winRate.toFixed(0) + "%", wins + " / " + total + " trades", "") +
      '</div>' + statsPanel +
      '<div class="panel"><h3>Add a Trade</h3><div class="form-row">' +
        '<label class="field"><span>Date</span><input id="tr_date" type="date" value="' + today() + '"/></label>' +
        '<label class="field"><span>Symbol</span><input id="tr_symbol" placeholder="BTC, AAPL…"/></label>' +
        '<label class="field"><span>Result</span><select id="tr_result"><option value="profit">Profit</option><option value="loss">Loss</option></select></label>' +
        '<label class="field"><span>Amount</span><input id="tr_amount" type="number" placeholder="0.00"/></label>' +
        '<label class="field"><span>Note (optional)</span><input id="tr_note" placeholder="Scalp, swing…"/></label>' +
        '<button class="btn" data-act="addTrade">+ Add</button>' +
      '</div></div>' +
      '<div class="panel"><h3>Balance Over Time</h3>' + areaChart(series) + '</div>' +
      '<div class="panel"><h3>Trade History</h3>' + (rows ?
        '<div style="overflow-x:auto"><table><thead><tr><th>Date</th><th>Symbol</th><th>Result</th><th style="text-align:right">Amount</th><th>Note</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>'
        : '<div class="empty">No trades logged yet.</div>') + '</div>' + symPanel;
  }

  function pageRecurring() {
    var opts = CATEGORIES.map(function (c) { return '<option value="' + c + '">' + c + '</option>'; }).join("");
    var hasAcc = (state.accounts || []).length > 0;
    var rows = state.recurring.length ? state.recurring.map(function (r) {
      return '<tr><td><span class="tag ' + (r.type === "income" ? "income" : "expense") + '">' + r.type + '</span></td>' +

        '<td class="mini">' + esc(r.note) + (r.account ? '<br>' + esc(accountName(r.account)) : '') + '</td>' +
        '<td><button class="icon-btn" data-act="delRecurring" data-id="' + r.id + '">✕</button></td></tr>';
    }).join("") : '';
    return '<h1 class="page-title">Recurring</h1><p class="page-sub">Set income or expenses that auto-add every month.</p>' +
      '<div class="panel"><h3>Add Recurring Entry</h3><div class="form-row">' +
        '<label class="field"><span>Type</span><select id="rc_type"><option value="expense">Expense</option><option value="income">Income</option></select></label>' +
        '<label class="field"><span>Category</span><select id="rc_cat">' + opts + '</select></label>' +
        '<label class="field"><span>Amount</span><input id="rc_amount" type="number" placeholder="0.00"/></label>' +
        '<label class="field"><span>Day of month</span><input id="rc_day" type="number" min="1" max="28" placeholder="1"/></label>' +
        (hasAcc ? '<label class="field"><span>Account' + (state.accountMode ? " (required)" : "") + '</span><select id="rc_account">' + accountOptions("", state.accountMode) + '</select></label>' : '') +
        '<label class="field"><span>Note (optional)</span><input id="rc_note" placeholder="Rent, Netflix…"/></label>' +
        '<button class="btn" data-act="addRecurring">+ Add</button>' +

      '<div class="panel"><h3>Your Recurring Entries</h3>' + (rows ?
        '<div style="overflow-x:auto"><table><thead><tr><th>Type</th><th>Category</th><th>When</th><th style="text-align:right">Amount</th><th>Note</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>'
        : '<div class="empty">No recurring entries yet.</div>') + '</div>';
  }

  function pageSubscriptions() {
    var subs = state.subscriptions;
    var monthly = subs.reduce(function (s, x) { return s + (x.cycle === "yearly" ? num(x.amount) / 12 : num(x.amount)); }, 0);
    var yearly = monthly * 12;
    var sorted = subs.slice().sort(function (a, b) { return (a.nextDate || "9999").localeCompare(b.nextDate || "9999"); });
    var rows = subs.length ? sorted.map(function (x) {
      var when = "—";
      if (x.nextDate) {
        var d = new Date(x.nextDate + "T00:00:00");
        var days = Math.round((d.getTime() - new Date(today() + "T00:00:00").getTime()) / 86400000);
        var lab = d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
        when = days < 0 ? '<span class="neg">overdue</span>' : days === 0 ? '<span class="pos">today</span>' : 'in ' + days + 'd · ' + lab;
      }
      return '<tr><td><strong>' + esc(x.name) + '</strong></td>' +
        '<td class="neg">' + fmt(x.amount) + ' <span class="mini">/' + (x.cycle === "yearly" ? "yr" : "mo") + '</span></td>' +
        '<td>' + when + '</td>' +

    return '<h1 class="page-title">Subscriptions</h1><p class="page-sub">Track your recurring services and what they cost.</p>' +

  function pageCompound() {
    if (pageCompound.p == null) { pageCompound.p = 1000; pageCompound.m = 100; pageCompound.r = 7; pageCompound.y = 10; }
    var P = num(pageCompound.p), PMT = num(pageCompound.m), rate = num(pageCompound.r), years = num(pageCompound.y);
    var r = rate / 100 / 12, months = Math.round(years * 12);
    var series = [], bal = P, fv;
    if (months > 0) {
      for (var i = 1; i <= months; i++) { bal = bal * (1 + r) + PMT; if (i % 12 === 0 || i === months) series.push({ date: "Y" + Math.ceil(i / 12), balance: bal }); }
      fv = bal;
    } else { fv = P; series = [{ date: "Y0", balance: P }]; }
    var contrib = P + PMT * months;
    var interest = fv - contrib;
    var cur = state.currency || "$";

    return '<h1 class="page-title">Compound Interest</h1><p class="page-sub">See how your money can grow over time.</p>' +
      '<div class="panel"><h3>Inputs</h3><div class="form-row">' +
        '<label class="field"><span>Starting amount (' + cur + ')</span><input id="ci_p" type="number" value="' + P + '"/></label>' +
        '<label class="field"><span>Monthly contribution (' + cur + ')</span><input id="ci_m" type="number" value="' + PMT + '"/></label>' +
        '<label class="field"><span>Annual interest rate %</span><input id="ci_r" type="number" value="' + rate + '"/></label>' +
        '<label class="field"><span>Years</span><input id="ci_y" type="number" value="' + years + '"/></label>' +
        '<button class="btn" data-act="calcCompound">Calculate</button>' +
      '</div><p class="mini" style="margin-top:10px">Assumes interest compounds monthly and contributions are added each month.</p></div>' +
      '<div class="cards">' +
        card("Future Value", fmt(fv), "After " + years + " year" + (years === 1 ? "" : "s"), "pos") +
        card("Total Contributions", fmt(contrib), "What you put in", "") +
        card("Interest Earned", fmt(interest), "Growth from compounding", "pos") +
        card("Growth", contrib > 0 ? (fv / contrib).toFixed(2) + "×" : "—", "Value ÷ contributions", "") +
      '</div>' +
      '<div class="panel"><h3>Projected Growth</h3>' + areaChart(series) + '</div>';
  }

  function pageCalendar() {
    if (!pageCalendar.ym) pageCalendar.ym = ymOfDate(new Date(today() + "T00:00:00"));
    var ym = pageCalendar.ym, pp = ym.split("-"), year = +pp[0], mon = +pp[1];
    var first = new Date(year, mon - 1, 1);
    var daysIn = new Date(year, mon, 0).getDate();
    var startDow = first.getDay();
    var evs = calendarEvents(ym), byDay = {};
    evs.forEach(function (e) { (byDay[e.day] = byDay[e.day] || []).push(e); });
    var todayD = (ym === ymOfDate(new Date(today() + "T00:00:00"))) ? (+today().slice(8, 10)) : -1;
    var monthLabel = first.toLocaleDateString(undefined, { month: "long", year: "numeric" });
    var dows = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].map(function (d) { return '<div class="mini" style="text-align:center;padding:4px 0">' + d + '</div>'; }).join("");
    var cells = "";
    for (var i = 0; i < startDow; i++) cells += "<div></div>";
    for (var d = 1; d <= daysIn; d++) {
      var de = byDay[d] || [];
      var dots = de.slice(0, 4).map(function (e) { return '<span style="display:inline-block;width:7px;height:7px;border-radius:50%;margin:1px;background:' + e.color + '"></span>'; }).join("");
      cells += '<div style="min-height:60px;background:var(--bg);border-radius:10px;padding:6px 7px;' + (d === todayD ? "outline:2px solid var(--accent);" : "") + '">' +
        '<div style="font-size:13px;font-weight:600;' + (d === todayD ? "color:var(--accent)" : "") + '">' + d + '</div>' +
        '<div style="text-align:center;margin-top:3px">' + dots + '</div></div>';
    }
    var list = evs.length ? evs.map(function (e) {
      return '<div class="row-between" style="padding:9px 2px;border-bottom:1px solid var(--border)"><span><span style="display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;background:' + e.color + '"></span>' + e.ico + ' ' + esc(e.label) + '</span><span class="mini">' + monthShort(ym) + ' ' + e.day + '</span></div>';
    }).join("") : '<div class="empty">Nothing scheduled this month.</div>';
    return '<h1 class="page-title">Calendar</h1><p class="page-sub">Payday, bills, plans and deadlines — all in one view.</p>' +
      '<div class="panel"><h3><button class="btn ghost sm" data-act="calPrev">◀</button><span style="flex:1;text-align:center">' + monthLabel + '</span><button class="btn ghost sm" data-act="calNext">▶</button></h3>' +
      '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px">' + dows + cells + '</div></div>' +
      '<div class="panel"><h3>This Month</h3>' + list + '</div>';
  }

  function pagePayday() {
    var p = state.payday || {};

    } else {
      var dl = new Date(p.date + "T00:00:00");
      var days = Math.round((dl.getTime() - new Date(today() + "T00:00:00").getTime()) / 86400000);
      var dateLabel = dl.toLocaleDateString(undefined, { weekday: "long", year: "numeric", month: "long", day: "numeric" });
      var lbl = esc(p.label || "Payday");
      var big;
      if (days > 0) {
        big = '<div class="card" style="text-align:center"><div class="label">' + lbl + ' in</div><div class="value" style="font-size:48px;color:var(--accent)">' + days + '</div><div class="sub">day' + (days === 1 ? "" : "s") + ' · ' + dateLabel + '</div></div>';
      } else if (days === 0) {

      }
