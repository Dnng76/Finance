  /* ---------- Roadmap, Forecast, Accounts ---------- */
  function addMonthsDate(base, n) { var d = new Date(base.getTime()); d.setMonth(d.getMonth() + n); return d; }
  function monthDateLabel(n) { return addMonthsDate(new Date(today() + "T00:00:00"), n).toLocaleDateString(undefined, { month: "short", year: "numeric" }); }
  function ymdLocal(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }

  function pageRoadmap() {
    var cur = state.currency || "$";
    var extra = num(pageRoadmap.extra);
    var save = num(state.roadmapSave);
    var debtSim = simulateDebts("snowball", extra);
    var debtMonths = state.debts.length ? debtSim.months : 0;
    var freedPayment = state.debts.reduce(function (s, d) { return s + num(d.payment); }, 0) + extra;
    var emTarget = num(state.emergency.monthlyExpenses) * num(state.emergency.months);
    var milestones = [];
    if (state.debts.length) {
      if (debtMonths === Infinity) milestones.push({ m: Infinity, icon: "🏁", label: "Debt-free", tone: "neg", sub: "payments too low to ever clear" });
      else if (debtMonths > 0) milestones.push({ m: debtMonths, icon: "🏁", label: "Debt-free", tone: "pos", sub: "all debts cleared" });
    }
    var ef = num(state.emergency.current);
    var goals = state.goals.map(function (g) { return { name: g.name, target: num(g.target), cur: num(g.current) }; });
    var efDone = ef >= emTarget || emTarget <= 0;
    var goalsDone = goals.every(function (g) { return g.cur >= g.target; });
    var guard = 0, month = 0;
    while ((!efDone || !goalsDone) && guard < 1200 && (save > 0 || freedPayment > 0)) {
      guard++; month++;
      var pool = save + (month > debtMonths ? freedPayment : 0);
      if (pool <= 0) break;
      if (!efDone && emTarget > 0) {
        var toEf = Math.min(pool, emTarget - ef); ef += toEf; pool -= toEf;
        if (ef >= emTarget - 0.005) { efDone = true; milestones.push({ m: month, icon: "🛡", label: "Emergency fund full", tone: "pos", sub: fmt(emTarget) + " reached" }); }
      }
      for (var i = 0; i < goals.length && pool > 0.005; i++) {
        var g = goals[i]; if (g.cur >= g.target) continue;
        var to = Math.min(pool, g.target - g.cur); g.cur += to; pool -= to;
        if (g.cur >= g.target - 0.005) milestones.push({ m: month, icon: "🎯", label: g.name, tone: "pos", sub: "goal reached · " + fmt(g.target) });
      }
      goalsDone = goals.every(function (g) { return g.cur >= g.target; });
    }
    milestones.sort(function (a, b) { return a.m - b.m; });
    var timeline = milestones.length ? milestones.map(function (ms) {
      var when = ms.m === Infinity ? '<span class="neg">Not on track</span>' : '<strong>' + monthDateLabel(ms.m) + '</strong> · ' + ms.m + ' mo away';
      return '<div style="display:flex;gap:14px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--border)">' +
        '<div style="width:44px;height:44px;border-radius:13px;background:var(--bg2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0">' + ms.icon + '</div>' +
        '<div style="flex:1;padding-top:2px"><div style="font-weight:600">' + esc(ms.label) + '</div><div class="mini">' + when + ' · ' + ms.sub + '</div></div></div>';
    }).join("") : '<div class="empty">Add debts, an emergency-fund target, or goals — then set a monthly savings amount below to see your roadmap.</div>';
    var unreached = [];
    if (!efDone && emTarget > 0) unreached.push("emergency fund");
    if (!goalsDone) unreached.push("some goals");
    var note = (save <= 0 && freedPayment <= 0) ? '<div class="hint">💡 Set a monthly savings amount below to project when you\'ll hit each milestone.</div>' :
      (unreached.length ? '<div class="hint">At this pace, ' + unreached.join(" & ") + ' won\'t be reached within 100 years — try increasing your monthly savings.</div>' : '');
    return '<h1 class="page-title">Roadmap</h1><p class="page-sub">Your financial future, projected from today\'s pace.</p>' +
      note +
      '<div class="panel"><h3>🗺 Milestones</h3>' + timeline + '</div>' +
      '<div class="panel"><h3>Adjust the plan</h3><div class="form-row" style="max-width:600px">' +
        '<label class="field"><span>Extra / mo toward debt (' + cur + ')</span><input id="rm_extra" type="number" value="' + extra + '"/></label>' +
        '<label class="field"><span>Monthly savings after expenses (' + cur + ')</span><input id="rm_save" type="number" value="' + save + '"/></label>' +
        '<button class="btn" data-act="rmApply">Update</button>' +
      '</div><p class="mini" style="margin-top:12px">Savings fill your <strong>emergency fund first</strong>, then your goals in order. When your debts clear, their monthly payments automatically join your savings and speed everything up. 🎯</p></div>';
  }

  function pageForecast() {
    var cur = state.currency || "$";
    var days = pageForecast.days || 60;
    var start = totals().balance;
    var now = new Date(today() + "T00:00:00");
    var events = [];
    (state.recurring || []).forEach(function (r) {
      var day = Math.min(28, Math.max(1, num(r.day) || 1));
      for (var mo = 0; mo <= Math.ceil(days / 28) + 1; mo++) {
        var d = new Date(now.getFullYear(), now.getMonth() + mo, day);
        var di = Math.round((d - now) / 86400000);
        if (di >= 0 && di <= days) events.push({ di: di, date: d, label: r.note || r.category || "Recurring", amt: r.type === "income" ? num(r.amount) : -num(r.amount) });
      }
    });
    (state.subscriptions || []).forEach(function (x) {
      if (!x.nextDate) return;
      var base = new Date(x.nextDate + "T00:00:00"); if (isNaN(base.getTime())) return;
      var step = x.cycle === "yearly" ? 12 : 1;
      for (var k = 0; k < 60; k++) {
        var d = new Date(base.getFullYear(), base.getMonth() + step * k, base.getDate());
        var di = Math.round((d - now) / 86400000);
        if (di > days) break;
        if (di >= 0) events.push({ di: di, date: d, label: x.name, amt: -num(x.amount) });
      }
    });
    var p = state.payday || {};
    if (p.date && num(p.amount) > 0) {
      var pbase = new Date(p.date + "T00:00:00");
      for (var k2 = 0; k2 < Math.ceil(days / 28) + 2; k2++) {
        var d2 = new Date(pbase.getFullYear(), pbase.getMonth() + k2, pbase.getDate());
        var di2 = Math.round((d2 - now) / 86400000);
        if (di2 > days) break;
        if (di2 >= 0) events.push({ di: di2, date: d2, label: p.label || "Payday", amt: num(p.amount) });
      }
    }
    (state.debts || []).forEach(function (dbt) {
      Object.keys(dbt.plans || {}).forEach(function (ym) {
        var amt = num(dbt.plans[ym].amount); if (amt <= 0) return;
        var pr = ym.split("-"); var d = new Date(+pr[0], +pr[1] - 1, 1);
        var di = Math.round((d - now) / 86400000);
        if (di >= 0 && di <= days) events.push({ di: di, date: d, label: "Debt: " + dbt.creditor, amt: -amt });
      });
    });
    events.sort(function (a, b) { return a.di - b.di; });
    var series = [], bal = start, ei = 0, minBal = start, minDay = 0, firstNeg = null;
    for (var day = 0; day <= days; day++) {
      while (ei < events.length && events[ei].di === day) { bal += events[ei].amt; ei++; }
      if (bal < minBal) { minBal = bal; minDay = day; }
      if (firstNeg === null && bal < 0) firstNeg = day;
      series.push({ date: ymdLocal(new Date(now.getTime() + day * 86400000)), balance: bal });
    }
    var endBal = series[series.length - 1].balance;
    var minDate = new Date(now.getTime() + minDay * 86400000).toLocaleDateString(undefined, { day: "numeric", month: "short" });
    var warn = firstNeg !== null ? '<div class="hint" style="border-color:rgba(248,113,113,.4);background:rgba(248,113,113,.08);color:#fca5a5">⚠ Projected to go negative around <strong>' +
      new Date(now.getTime() + firstNeg * 86400000).toLocaleDateString(undefined, { day: "numeric", month: "short" }) + '</strong> (low of ' + fmt(minBal) + ' on ' + minDate + '). Hold back about ' + fmt(Math.abs(minBal)) + ' before then.</div>' : '';
    var daybtns = [30, 60, 90].map(function (d) { return '<button class="btn ' + (days === d ? "" : "ghost") + ' sm" data-act="fcDays" data-k="' + d + '">' + d + ' days</button>'; }).join(" ");
    var upcoming = events.filter(function (e) { return e.di <= days; }).slice(0, 16).map(function (e) {
      var when = e.di === 0 ? "today" : "in " + e.di + "d · " + e.date.toLocaleDateString(undefined, { day: "numeric", month: "short" });
      return '<div class="row-between" style="padding:9px 0;border-bottom:1px solid var(--border)"><span>' + esc(e.label) + ' <span class="mini">· ' + when + '</span></span><span class="' + (e.amt >= 0 ? "pos" : "neg") + '">' + (e.amt >= 0 ? "+" : "−") + fmt(Math.abs(e.amt)) + '</span></div>';
    }).join("");
    return '<h1 class="page-title">Cash-flow Forecast</h1><p class="page-sub">Your projected balance, day by day — so you know you\'ll make it to payday.</p>' +
      warn +
      '<div class="toolbar" style="margin-bottom:16px">' + daybtns + '</div>' +
      '<div class="cards">' +
        card("Balance now", fmt(start), "today", start >= 0 ? "pos" : "neg", "💰", "rgba(52,211,153,.16)") +
        card("Lowest point", fmt(minBal), "around " + minDate, minBal >= 0 ? "" : "neg", "📉", "rgba(248,113,113,.16)") +
        card("In " + days + " days", fmt(endBal), "projected balance", endBal >= 0 ? "pos" : "neg", "🔮", "rgba(56,189,248,.16)") +
      '</div>' +
      '<div class="panel"><h3>Projected Balance</h3>' + areaChart(series) + '</div>' +
      '<div class="panel"><h3>Upcoming money movements</h3>' + (upcoming || '<div class="empty">No scheduled income or bills in this window. Add payday, subscriptions, or recurring items to see a forecast.</div>') + '</div>';
  }

      '<button class="btn ' + (state.accountMode ? "ghost" : "") + '" data-act="toggleAccountMode">' + (state.accountMode ? "Use transaction ledger" : "Use accounts for Dashboard") + '</button></div>' +
      (state.accountMode && unassigned ? '<div class="hint" style="margin-top:14px">' + unassigned + ' older transaction' + (unassigned === 1 ? " is" : "s are") + ' not assigned to an account. They remain in reports but do not change the account-based Dashboard balance.</div>' : '') + '</div>';

  function avgMonthlyExpenseCalc() {
    var realYm = ymOfDate(new Date(today() + "T00:00:00"));
    var per = {};
    state.transactions.forEach(function (t) { if (t.type !== "expense") return; var k = (t.date || "").slice(0, 7); if (!k) return; per[k] = (per[k] || 0) + num(t.amount); });
    var keys = Object.keys(per).filter(function (k) { return k !== realYm; }).sort().slice(-6);
    if (!keys.length) return per[realYm] || 0;
    return keys.reduce(function (s, k) { return s + per[k]; }, 0) / keys.length;
  }

  function pageFreedom() {

    var invest = num(f.invest) > 0 ? num(f.invest) : num(state.roadmapSave);
    var mult = 100 / swr;
    var fiNumber = mExp * 12 * mult;
    var pct = fiNumber > 0 ? assets / fiNumber * 100 : 0;
    var passiveMo = assets * (swr / 100) / 12;
    var coverage = mExp > 0 ? passiveMo / mExp * 100 : 0;
    function monthsToFI(extra) {
      if (fiNumber <= 0) return Infinity;
      var a = assets, r = growth / 100 / 12, monthly = invest + extra, m = 0;
      if (a >= fiNumber) return 0;
      if (monthly <= 0 && (r <= 0 || a <= 0)) return Infinity;
      while (a < fiNumber && m < 1200) { m++; a = a * (1 + r) + monthly; }
      return m >= 1200 ? Infinity : m;
    }
    function dateLabel(m) { if (m === 0) return "Now 🎉"; if (m === Infinity) return "—"; return addMonthsDate(new Date(today() + "T00:00:00"), m).toLocaleDateString(undefined, { month: "short", year: "numeric" }); }
    function durLabel(m) { if (m === 0) return "you're already there"; if (m === Infinity) return "not reachable at this pace"; var y = Math.floor(m / 12), mo = m % 12; return "in " + (y ? y + " yr " : "") + (mo ? mo + " mo" : (y ? "" : "0 mo")); }

  function pageBudget() {
    var cur = state.currency || "$";
    var realYm = ymOfDate(new Date(today() + "T00:00:00"));
    if (!pageBudget.ym) pageBudget.ym = realYm;
    var ym = pageBudget.ym;
    var mp = ym.split("-");
    var monthLabel = new Date(mp[0], (+mp[1]) - 1, 1).toLocaleDateString(undefined, { month: "long", year: "numeric" });
    var spent = {};
    state.transactions.forEach(function (t) { if (t.type === "expense" && (t.date || "").slice(0, 7) === ym) { var c = t.category || "Other"; spent[c] = (spent[c] || 0) + num(t.amount); } });
    var b = state.budgets || {}, keys = Object.keys(b).filter(function (c) { return num(b[c]) > 0; });
    var goal = keys.reduce(function (s, c) { return s + num(b[c]); }, 0);
    var used = keys.reduce(function (s, c) { return s + (spent[c] || 0); }, 0);
    var totalSpent = Object.keys(spent).reduce(function (s, c) { return s + spent[c]; }, 0);
    var remaining = goal - used;
    var usedPct = goal > 0 ? Math.min(100, used / goal * 100) : 0;

  function toast(msg, icon, actionLabel, actionFn, duration) {
    var wrap = document.getElementById("ftToasts");

    var dot = document.createElement("span"); dot.className = "tdot"; dot.textContent = icon || "✓";
    var txt = document.createElement("span"); txt.textContent = msg;
    t.appendChild(dot); t.appendChild(txt);
    var timer = null, close = function () {
      if (timer) clearTimeout(timer);
      t.classList.add("out");
      setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 320);
    };
    if (actionLabel && actionFn) {
      var action = document.createElement("button");
      action.className = "undo-btn"; action.type = "button"; action.textContent = actionLabel;
      action.onclick = function () { actionFn(); close(); };
      t.appendChild(action);
    }
    wrap.appendChild(t);
    timer = setTimeout(close, duration || (actionFn ? 6000 : 1900));
  }
  function removeWithUndo(getList, id, label, onRemove, onRestore) {
    var list = getList(), index = -1;
    for (var i = 0; i < list.length; i++) if (list[i].id === id) { index = i; break; }
    if (index < 0) return;
    var item = clone(list[index]);
    if (onRemove) onRemove(item);
    list.splice(index, 1); save(); render();
    toast(label + " deleted", "↶", "Undo", function () {
      var current = getList(), exists = current.some(function (x) { return x.id === item.id; });
      if (!exists) { current.splice(Math.min(index, current.length), 0, item); if (onRestore) onRestore(item); }
      save(); render(); toast(label + " restored", "✓");
    });
  }

        if (!on && set) { on = set.querySelector('[data-qcat="' + (ty === "income" ? (pageTransactions.lastIncCat || "Salary") : (pageTransactions.lastExpCat || "Food")) + '"]') || set.querySelector(".qa-chip"); if (on) on.classList.add("on"); }
        if (on) el("t_cat").value = on.getAttribute("data-qcat");
        if (el("t_amount")) el("t_amount").focus();
      };
    });
    root.querySelectorAll("[data-qcat]").forEach(function (b) {
      b.onclick = function () {
        b.parentNode.querySelectorAll(".qa-chip").forEach(function (x) { x.classList.toggle("on", x === b); });
        el("t_cat").value = b.getAttribute("data-qcat");
      };
    });
    ["t_amount", "t_note"].forEach(function (id) {
      if (el(id) && el("t_cat")) el(id).onkeydown = function (ev) { if (ev.key === "Enter") { ev.preventDefault(); actions.addTx(); } };
    });
    if (el("impFile")) el("impFile").onchange = function (ev) {
      var file = ev.target.files[0]; if (!file) return;
      var reader = new FileReader();
      reader.onload = function (e) {
        try {
          var obj = JSON.parse(e.target.result);
          var ph = obj._photos; delete obj._photos;
          state = Object.assign(clone(defaultData), obj);
          var restored = 0;
          if (ph) {
            if (ph.debt && ph.debt.length) { debtPhotos = ph.debt; saveDebtPhotos(); restored += ph.debt.length; }
            if (ph.budget && ph.budget.length) { budgetPhotos = ph.budget; saveBudgetPhotos(); restored += ph.budget.length; }
            if (ph.goal && ph.goal.length) { goalPhotos = ph.goal; saveGoalPhotos(); restored += ph.goal.length; }
          }
          save(); render();
          el("dataMsg").innerHTML = '<div class="hint">✓ Data restored successfully' + (restored ? ' — including ' + restored + ' photo' + (restored === 1 ? '' : 's') + '.' : '.') + '</div>';
        }
        catch (err) { if (el("dataMsg")) el("dataMsg").innerHTML = '<div class="hint" style="color:#fca5a5">✕ Could not read that file.</div>'; }
      };
      reader.readAsText(file);
    };
    // emergency live inputs
    if (el("debtPhotoFile")) el("debtPhotoFile").onchange = function (ev) { addDebtPhotoFile(ev.target.files[0]); this.value = ""; };
    if (el("budgetPhotoFile")) el("budgetPhotoFile").onchange = function (ev) { addBudgetPhotoFile(ev.target.files[0]); this.value = ""; };
    if (el("goalPhotoFile")) el("goalPhotoFile").onchange = function (ev) { addGoalPhotoFile(ev.target.files[0]); this.value = ""; };
    if (el("gpln_month")) el("gpln_month").onchange = function () { commitGoalPlan(); goalPlanMonth = this.value || goalPlanMonth; render(); };
    if (el("ins_month")) el("ins_month").onchange = function () { pageInsights.ym = this.value || pageInsights.ym; render(); };
    if (el("bgt_month")) el("bgt_month").onchange = function () { pageBudget.ym = this.value || pageBudget.ym; render(); };
    if (el("ed_preview")) {
      var edUpd = function () { el("ed_preview").innerHTML = debtPayoffPreview(val("ed_remaining"), val("ed_payment"), val("ed_rate"), val("ed_start")); };
      ["ed_remaining", "ed_payment", "ed_rate", "ed_start"].forEach(function (id) { if (el(id)) { el(id).oninput = edUpd; el(id).onchange = edUpd; } });
    }
    if (el("sch_from")) el("sch_from").onchange = function () { var rg = debtScheduleRange(); pageDebt.schedFrom = this.value || rg.from; if (!pageDebt.schedTo) pageDebt.schedTo = rg.to; if (pageDebt.schedTo < pageDebt.schedFrom) pageDebt.schedTo = pageDebt.schedFrom; render(); };
    if (el("sch_to")) el("sch_to").onchange = function () { var rg = debtScheduleRange(); pageDebt.schedFrom = rg.from; pageDebt.schedTo = this.value || rg.to; render(); };
    if (el("lv_from") && el("lv_to") && el("lv_days")) {
      var lvPreview = function () {
        var f = el("lv_from").value, t = el("lv_to").value;
        if (f && (!t || t < f)) { el("lv_to").value = f; t = f; }
        var ty = el("lv_type") ? el("lv_type").value : "annual";
        if (f) { var n = leaveAutoDays(f, t, ty); el("lv_days").placeholder = "auto: " + (ty === "earned" ? "+" : "") + n; }
        if (el("lv_note")) el("lv_note").placeholder = ty === "earned" ? "e.g. worked Saturday event" : "e.g. Korea trip";
      };
      el("lv_from").onchange = lvPreview; el("lv_to").onchange = lvPreview;
      if (el("lv_type")) el("lv_type").onchange = lvPreview;
      lvPreview();
    }
    if (el("pln_month")) el("pln_month").onchange = function () { commitPlan(); planMonth = this.value || planMonth; render(); };
    if (el("pace_target")) el("pace_target").onchange = function () { state.paceTarget = this.value || ""; save(); render(); };
    if (el("em_exp")) el("em_exp").oninput = function () { state.emergency.monthlyExpenses = num(this.value); save(); paintEmergency(); };
    if (el("em_cur")) el("em_cur").oninput = function () { state.emergency.current = num(this.value); save(); paintEmergency(); };
    if (el("em_months")) el("em_months").oninput = function () { state.emergency.months = num(this.value); save(); paintEmergency(); };
  }

  // boot
  try {
    state = load();
    var linkedTab = new URLSearchParams(location.search).get("tab");
    if (navBase().some(function (n) { return n.id === linkedTab; })) currentTab = linkedTab;
    loadDebtPhotos();
    loadBudgetPhotos();
    loadGoalPhotos();
    try { privacy = localStorage.getItem("ft_privacy") === "1"; } catch (e) {}
    if (state.hideOnOpen) privacy = true;
    try { theme = localStorage.getItem("ft_theme") || "dark"; } catch (e) {}
    applyTheme();
    if (state.pin) locked = true;
    applyRecurring();
    recordNetWorth();
    booting = false; // start-up housekeeping above isn't a user edit; everything after this is
    render();
    if (!initCloud()) finishSplash(); // reconnects automatically if you've set up sync before
    setTimeout(finishSplash, 5000); // network fallback: never leave the launch screen stuck

    // Swipe left/right to move between tabs (mobile)
    var tsX = 0, tsY = 0, tsT = 0;
    document.addEventListener("touchstart", function (e) {
      if (e.touches.length !== 1) { tsT = 0; return; }
      tsX = e.touches[0].clientX; tsY = e.touches[0].clientY; tsT = Date.now();
    }, { passive: true });
    document.addEventListener("touchend", function (e) {
      if (!tsT || locked || moreOpen) return;
      var dx = e.changedTouches[0].clientX - tsX, dy = e.changedTouches[0].clientY - tsY, dt = Date.now() - tsT;
      tsT = 0;
      if (dt > 600 || Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.8) return;
      var t = e.target; // ignore swipes inside a horizontally-scrollable element
      while (t && t !== document.body) { try { if (t.scrollWidth > t.clientWidth + 4 && /auto|scroll/.test(getComputedStyle(t).overflowX)) return; } catch (er) {} t = t.parentNode; }
      var ids = orderedNav().map(function (n) { return n.id; });
      var i = ids.indexOf(currentTab); if (i < 0) return;
      var ni = dx < 0 ? i + 1 : i - 1;
      if (ni < 0 || ni >= ids.length) return;
      currentTab = ids[ni]; window.scrollTo(0, 0); render();
    }, { passive: true });

    var shield = document.createElement("div");
    shield.id = "ftShield";
    shield.style.cssText = "position:fixed;inset:0;background:#0b1120;display:none;align-items:center;justify-content:center;z-index:99999;font-size:64px";
    shield.textContent = "🔒";
    document.body.appendChild(shield);
    var coverNow = function () {
      shield.style.display = "flex";
      if (state && state.hideOnOpen) { privacy = true; try { localStorage.setItem("ft_privacy", "1"); } catch (e) {} }
      if (state && state.pin) { locked = true; pinBuffer = ""; pinError = false; }
      el("ftToasts").textContent = "";
    };
    var uncover = function () { shield.style.display = "none"; render(); };
    // Self-update: phones keep the installed app in memory, so check the live site for a newer build
    // whenever the app is opened or brought back, and reload into it (unsaved typing is never interrupted).
    var myBuild = num((VERSION.match(/build (\d+)/) || [])[1]), lastUpdCheck = 0;
    var checkForUpdate = function () {
      if (location.protocol.indexOf("http") !== 0 || Date.now() - lastUpdCheck < 30000) return;
      lastUpdCheck = Date.now();
      fetch(location.pathname + "?v=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.text(); }).then(function (html) {
        var live = num((html.match(/<title>[^<]*build (\d+)/) || [])[1]);
        if (!(live > myBuild)) return;
        var typing = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
        if (typing || pushTimer) { lastUpdCheck = 0; return; }   // try again next time instead of losing anything
        toast("Updating to build " + live + "…", "⬆");
        setTimeout(function () { location.reload(); }, 900);
      }).catch(function () {});
    };
    setTimeout(checkForUpdate, 4000);
    document.addEventListener("visibilitychange", function () { if (document.hidden) { cloudPushNow(); coverNow(); } else { uncover(); checkForUpdate(); } });
    window.addEventListener("pagehide", function () { cloudPushNow(); coverNow(); });
    window.addEventListener("pageshow", uncover);
    window.addEventListener("offline", updateSyncIndicators);
    window.addEventListener("online", function () { updateSyncIndicators(); if (cloud.user && cloud.db) subscribe(); else if (!cloud.ready) initCloud(); });
  } catch (err) {
    var spf = document.getElementById("ftSplash"); if (spf && spf.parentNode) spf.parentNode.removeChild(spf);
    document.getElementById("root").innerHTML = '<div style="padding:40px;color:#f87171;font-family:monospace">Error: ' + esc(err.message) + '</div>';
  }
})();
</script>
<script>
/* Remove any old service worker + caches so the app always loads the freshest version */
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.getRegistrations().then(function (regs) { regs.forEach(function (r) { r.unregister(); }); }).catch(function () {});
}
if (window.caches && caches.keys) { caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); }).catch(function () {}); }
</script>
</body>
</html>
